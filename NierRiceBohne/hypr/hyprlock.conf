# NierRiceBohne: Sperrbildschirm (hyprlock)
# Doku: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
}

# Wallpaper, leicht abgedunkelt
background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpeg
    color = rgba(25, 22, 23, 1.0)
    blur_passes = 1
    blur_size = 3
    brightness = 0.55
}

# Titel
label {
    monitor =
    text = [ BUNKER SYSTEM // LOCKED ]
    color = rgba(117, 108, 99, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# Uhrzeit
label {
    monitor =
    text = $TIME
    color = rgba(117, 108, 99, 1.0)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# Passwortfeld
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    rounding = 0
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(117, 108, 99, 1.0)
    inner_color = rgba(25, 22, 23, 1.0)
    font_color = rgba(117, 108, 99, 1.0)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = [ PASSWORD ]
    check_color = rgba(117, 108, 99, 1.0)
    fail_color = rgba(163, 0, 0, 1.0)
    fail_text = [ ACCESS DENIED ] $ATTEMPTS
    position = 0, -40
    halign = center
    valign = center
}
